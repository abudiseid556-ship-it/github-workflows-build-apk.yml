name: Build Hesab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Hesab project
        run: |
          unzip -o Hesab_Android_App_APK_BuildReady_v2.zip
          cd hesab_android_app
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd hesab_android_app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-APK
          path: hesab_android_app/android/app/build/outputs/apk/debug/app-debug.apk
